function Lore({items,accent,label,icon,exp,setExp}){
  if(!items||!items.length)return null;
  return(<div style={{background:"rgba(255,255,255,0.03)",borderRadius:14,padding:"14px 16px",border:"1px solid rgba(255,255,255,0.06)"}}>
    <div style={{fontSize:9,fontWeight:700,color:accent,letterSpacing:"1.5px",fontFamily:"'Space Mono',monospace",marginBottom:10,textTransform:"uppercase",opacity:.8}}>{icon} {label}</div>
    <div style={{display:"flex",flexWrap:"wrap",gap:6,alignItems:"flex-start"}}>
      {items.map((l,i)=>(<div key={i} style={{display:"flex",flexDirection:"column"}}>
        <button onClick={e=>{e.stopPropagation();setExp(exp===i?null:i)}} style={{
          background:exp===i?`${accent}18`:`${accent}0A`,border:`1px solid ${exp===i?accent+"40":accent+"20"}`,
          borderRadius:exp===i?"10px 10px 0 0":10,padding:"5px 12px",cursor:"pointer",transition:"all .2s",
          fontSize:12,fontWeight:600,fontFamily:"'Outfit',sans-serif",color:exp===i?accent:"rgba(255,255,255,.6)",
          whiteSpace:"nowrap",lineHeight:1.4}}>{l.k}</button>
        {exp===i&&<div style={{background:`${accent}0A`,borderRadius:"0 0 10px 10px",border:`1px solid ${accent}20`,
          borderTop:"none",padding:"8px 12px",fontSize:12,lineHeight:1.5,color:"rgba(255,255,255,.55)",
          fontFamily:"'Outfit',sans-serif",maxWidth:320}}>{l.d}</div>}
      </div>))}
    </div></div>);
}

function Card({stop,isOpen,onToggle,index}){
  const[e0,s0]=useState(null);const[e1,s1]=useState(null);const[e2,s2]=useState(null);const[e3,s3]=useState(null);const[e4,s4]=useState(null);
  const exps=[[e0,s0],[e1,s1],[e2,s2],[e3,s3],[e4,s4]];
  return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",width:"100%",marginBottom:4,position:"relative"}}>
    {index>0&&<div style={{width:2,height:36,background:`linear-gradient(to bottom,${S[index-1].accent}60,${stop.accent}60)`,boxShadow:`0 0 8px ${stop.accent}30`,position:"relative"}}><GlowDot color={stop.accent} size={5} style={{position:"absolute",bottom:-2,left:-1.5}}/></div>}
    {stop.drive&&<div style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",borderRadius:20,padding:"5px 14px",fontSize:10.5,fontFamily:"'Space Mono',monospace",color:"rgba(255,255,255,.5)",marginBottom:8,textAlign:"center",maxWidth:300}}>{stop.drive}</div>}
    <div onClick={onToggle} style={{width:"100%",maxWidth:540,background:isOpen?`linear-gradient(135deg,${stop.accent}12 0%,${stop.accent}06 50%,rgba(15,10,40,.8) 100%)`:"rgba(255,255,255,.04)",borderRadius:20,border:isOpen?`1.5px solid ${stop.accent}50`:"1.5px solid rgba(255,255,255,.07)",cursor:"pointer",overflow:"hidden",transition:"all .35s cubic-bezier(.4,0,.2,1)",boxShadow:isOpen?`0 0 30px ${stop.accent}15,0 8px 32px rgba(0,0,0,.3)`:"0 2px 8px rgba(0,0,0,.2)"}}>
      <div style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:52,height:52,borderRadius:14,background:`linear-gradient(135deg,${stop.accent}20,${stop.accent}08)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,flexShrink:0,border:`1.5px solid ${stop.accent}30`,boxShadow:`0 0 20px ${stop.accent}10`}}>{stop.emoji}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontFamily:"'Outfit'",fontSize:20,fontWeight:700,color:"white"}}>{stop.label}</span>
            {stop.warning&&<span style={{fontSize:9,background:"#FF6B35",color:"white",padding:"2px 8px",borderRadius:10,fontWeight:800,letterSpacing:"1px",fontFamily:"'Space Mono',monospace"}}>HOT</span>}
          </div>
          <div style={{fontFamily:"'Space Mono',monospace",fontSize:11,color:stop.accent,fontWeight:700,marginTop:2,opacity:.9}}>{stop.day} · {stop.date}</div>
          <div style={{fontFamily:"'Outfit'",fontSize:13,color:"rgba(255,255,255,.5)",marginTop:3,lineHeight:1.4}}>{stop.note}</div>
        </div>
        <div style={{fontSize:16,color:stop.accent,transition:"transform .3s",transform:isOpen?"rotate(180deg)":"rotate(0deg)",opacity:.7}}>▾</div>
      </div>
      <div style={{maxHeight:isOpen?3000:0,opacity:isOpen?1:0,overflow:"hidden",transition:"all .4s cubic-bezier(.4,0,.2,1)"}}>
        <div style={{padding:"0 20px 20px",display:"flex",flexDirection:"column",gap:12}}>
          {stop.arch&&<div style={{background:`linear-gradient(135deg,${stop.accent}15,${stop.accent}05)`,borderRadius:14,padding:"16px 18px",border:`1.5px solid ${stop.accent}25`,position:"relative",overflow:"hidden"}}><div style={{position:"absolute",top:-20,right:-20,fontSize:80,opacity:0.06,fontFamily:"'Outfit'"}}>{stop.emoji}</div><div style={{fontSize:9,fontWeight:700,color:stop.accent,letterSpacing:"2px",fontFamily:"'Space Mono',monospace",textTransform:"uppercase",opacity:.7,marginBottom:6}}>🏛️ American spirit</div><div style={{fontSize:18,fontWeight:800,color:"white",fontFamily:"'Outfit'",marginBottom:6}}>{stop.arch.title}</div><div style={{fontSize:13,color:"rgba(255,255,255,.6)",lineHeight:1.6,fontFamily:"'Outfit'",fontWeight:400,fontStyle:"italic"}}>{stop.arch.desc}</div></div>}
          {V.map((voice,vi)=><Lore key={vi} items={stop.v[vi]} accent={stop.accent} label={voice.label} icon={voice.icon} exp={exps[vi][0]} setExp={exps[vi][1]}/>)}
          {stop.stay&&<div style={{background:"rgba(255,255,255,.04)",borderRadius:14,padding:"12px 16px",display:"flex",alignItems:"center",gap:10,border:"1px solid rgba(255,255,255,.06)"}}><span style={{fontSize:18}}>🛏️</span><div><div style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,.3)",letterSpacing:"1.5px",fontFamily:"'Space Mono',monospace",textTransform:"uppercase"}}>Staying at</div><div style={{fontSize:14,color:"rgba(255,255,255,.85)",fontWeight:600,fontFamily:"'Outfit'",marginTop:2}}>{stop.stay}</div></div></div>}
          {stop.kids&&<div style={{background:"rgba(255,255,255,.04)",borderRadius:14,padding:"14px 16px",border:"1px solid rgba(255,255,255,.06)"}}><div style={{fontSize:9,fontWeight:700,color:stop.accent,letterSpacing:"1.5px",fontFamily:"'Space Mono',monospace",marginBottom:10,textTransform:"uppercase",opacity:.8}}>👦 Kid-friendly picks</div><div style={{display:"flex",flexDirection:"column",gap:8}}>{stop.kids.map((k,i)=><div key={i} style={{display:"flex",alignItems:"flex-start",gap:10}}><span style={{width:20,height:20,borderRadius:6,background:`${stop.accent}18`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:stop.accent,fontWeight:800,flexShrink:0,fontFamily:"'Space Mono',monospace",border:`1px solid ${stop.accent}25`}}>{i+1}</span><span style={{fontSize:13,color:"rgba(255,255,255,.7)",lineHeight:1.5,fontFamily:"'Outfit'"}}>{k}</span></div>)}</div></div>}
          {stop.activities&&<div style={{background:"rgba(255,255,255,.04)",borderRadius:14,padding:"14px 16px",border:"1px solid rgba(255,255,255,.06)"}}><div style={{fontSize:9,fontWeight:700,color:stop.accent,letterSpacing:"1.5px",fontFamily:"'Space Mono',monospace",marginBottom:10,textTransform:"uppercase",opacity:.8}}>🗺️ Don't-miss</div><div style={{display:"flex",flexDirection:"column",gap:8}}>{stop.activities.map((a,i)=><div key={i} style={{display:"flex",alignItems:"flex-start",gap:10}}><GlowDot color={stop.accent} size={5} style={{marginTop:7}}/><span style={{fontSize:13,color:"rgba(255,255,255,.7)",lineHeight:1.5,fontFamily:"'Outfit'"}}>{a}</span></div>)}</div></div>}
          {!stop.kids&&!stop.activities&&stop.type==="city"&&<div style={{background:"rgba(255,255,255,.02)",borderRadius:14,padding:"24px 16px",textAlign:"center",border:`1.5px dashed ${stop.accent}25`}}><div style={{fontSize:24,marginBottom:6}}>✨</div><div style={{fontSize:13,color:"rgba(255,255,255,.3)",fontStyle:"italic",fontFamily:"'Outfit'"}}>Your blank canvas</div></div>}
          {stop.tip&&<div style={{background:stop.warning?"rgba(255,107,53,.08)":"rgba(255,255,255,.03)",borderRadius:12,padding:"10px 14px",display:"flex",gap:8,alignItems:"flex-start",border:stop.warning?"1px solid rgba(255,107,53,.15)":"1px solid rgba(255,255,255,.04)"}}><span style={{fontSize:13,flexShrink:0}}>{stop.warning?"🔥":"💡"}</span><span style={{fontSize:12,color:stop.warning?"#FFB088":"rgba(255,255,255,.45)",lineHeight:1.55,fontFamily:"'Outfit'"}}>{stop.tip}</span></div>}
        </div></div>
    </div></div>);
}

function TextSize({scale,setScale,show,setShow}){
  const stops=[{z:.8,l:"XS"},{z:.9,l:"S"},{z:1,l:"M"},{z:1.1,l:"L"},{z:1.25,l:"XL"},{z:1.4,l:"2XL"},{z:1.6,l:"3XL"}];
  const idx=stops.findIndex(s=>s.z===scale);
  return(<>
    <button onClick={()=>setShow(!show)} style={{position:"fixed",bottom:24,right:24,zIndex:100,width:44,height:44,borderRadius:14,background:"rgba(255,255,255,.08)",border:"1.5px solid rgba(255,255,255,.12)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,color:"rgba(255,255,255,.6)",fontWeight:700,fontFamily:"'Outfit',sans-serif",backdropFilter:"blur(12px)",boxShadow:"0 4px 20px rgba(0,0,0,.3)",transition:"all .2s"}}>Aa</button>
    {show&&<div onClick={()=>setShow(false)} style={{position:"fixed",inset:0,zIndex:98}}/>}
    {show&&<div style={{position:"fixed",bottom:80,right:24,zIndex:99,background:"rgba(15,10,40,.95)",border:"1.5px solid rgba(255,255,255,.12)",borderRadius:18,padding:"18px 20px",backdropFilter:"blur(16px)",boxShadow:"0 8px 40px rgba(0,0,0,.5)",width:280}}>
      <div style={{fontSize:9,fontWeight:700,color:"rgba(255,255,255,.35)",letterSpacing:"1.5px",fontFamily:"'Space Mono',monospace",textTransform:"uppercase",marginBottom:14}}>Text size</div>
      <div style={{display:"flex",alignItems:"center",gap:0,position:"relative",marginBottom:12}}>
        <div style={{position:"absolute",top:"50%",left:8,right:8,height:2,background:"rgba(255,255,255,.08)",transform:"translateY(-50%)",borderRadius:1}}/>
        {stops.map((s,i)=><button key={i} onClick={(e)=>{e.stopPropagation();setScale(s.z);try{localStorage.setItem("tz",s.z)}catch(e){}}} style={{flex:1,display:"flex",justifyContent:"center",position:"relative",zIndex:1,background:"none",border:"none",cursor:"pointer",padding:"8px 0"}}>
          <div style={{width:i===idx?18:10,height:i===idx?18:10,borderRadius:"50%",background:i===idx?"#FF2D87":"rgba(255,255,255,.2)",boxShadow:i===idx?"0 0 12px #FF2D8760":"none",transition:"all .2s",border:i===idx?"2px solid #FF2D87":"2px solid transparent"}}/>
        </button>)}
      </div>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"rgba(255,255,255,.3)",fontFamily:"'Space Mono',monospace"}}>
        <span>A</span><span style={{fontSize:14}}>A</span>
      </div>
      {scale!==1&&<button onClick={(e)=>{e.stopPropagation();setScale(1);try{localStorage.setItem("tz",1)}catch(e){}}} style={{marginTop:10,width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,padding:"8px",cursor:"pointer",fontSize:11,color:"rgba(255,255,255,.4)",fontFamily:"'Outfit',sans-serif"}}>Reset to default</button>}
    </div>}
  </>);
}

function App(){
  const[openId,setOpenId]=useState(null);
  const[showTz,setShowTz]=useState(false);
  const[scale,setScale]=useState(()=>{try{const v=parseFloat(localStorage.getItem("tz"));return v&&[.8,.9,1,1.1,1.25,1.4,1.6].includes(v)?v:1}catch(e){return 1}});
  const[stars]=useState(()=>Array.from({length:80},(_,i)=>({id:i,left:`${Math.random()*100}%`,top:`${Math.random()*5500}px`,size:1+Math.random()*2,delay:Math.random()*5,dur:3+Math.random()*5})));
  const total=S.reduce((n,s)=>n+s.v.reduce((m,a)=>m+a.length,0),0);
  return(<div style={{minHeight:"100vh",background:"linear-gradient(180deg,#0A0618 0%,#12082A 30%,#0D0B2E 60%,#08061A 100%)",fontFamily:"'Outfit',sans-serif",position:"relative",overflow:"hidden",zoom:scale}}>
    <TextSize scale={scale} setScale={setScale} show={showTz} setShow={setShowTz}/>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    <style>{`@keyframes tw{0%,100%{opacity:.12}50%{opacity:.7}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pu{0%,100%{opacity:.3}50%{opacity:1}}@keyframes su{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@keyframes gs{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}`}</style>
    {stars.map(s=><div key={s.id} style={{position:"absolute",left:s.left,top:s.top,width:s.size,height:s.size,borderRadius:"50%",background:"white",animation:`tw ${s.dur}s ease-in-out ${s.delay}s infinite`,pointerEvents:"none"}}/>)}
    {[[60,-100,"#FF2D87"],[500,null,"#00F0FF"],[1400,-100,"#B8FF00"],[2800,null,"#A855F7"],[3800,-80,"#FFD600"]].map(([t,l,c],i)=><div key={i} style={{position:"absolute",top:t,...(l!==null?{left:l}:{right:-120}),width:400,height:400,borderRadius:"50%",background:`radial-gradient(circle,${c}08 0%,transparent 70%)`,pointerEvents:"none"}}/>)}
    <div style={{position:"relative",padding:"52px 24px 36px",textAlign:"center",zIndex:1,animation:"su .8s ease-out"}}>
      <div style={{fontFamily:"'Space Mono',monospace",fontSize:10,letterSpacing:"4px",color:"#FF2D87",fontWeight:700,textTransform:"uppercase",marginBottom:16,opacity:.8}}>Summer 2026</div>
      <h1 style={{fontFamily:"'Outfit'",fontSize:44,fontWeight:900,lineHeight:1.02,margin:"0 0 6px",letterSpacing:"-2px",background:"linear-gradient(135deg,#FFF 0%,#FF2D87 35%,#00F0FF 65%,#B8FF00 100%)",backgroundSize:"200% 200%",animation:"gs 8s ease infinite",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>The Great<br/>American West</h1>
      <div style={{fontSize:14,color:"rgba(255,255,255,.35)",marginTop:12,fontWeight:300}}>A family road trip · California, Nevada, Utah & Arizona</div>
      <div style={{display:"flex",justifyContent:"center",gap:20,marginTop:28,flexWrap:"wrap"}}>
        {[{n:"15",l:"days",c:"#FF2D87"},{n:"4",l:"parks",c:"#00F0FF"},{n:"5",l:"voices",c:"#B8FF00"},{n:String(total),l:"things to know",c:"#FFD600"}].map((s,i)=><div key={i} style={{textAlign:"center"}}><div style={{fontSize:28,fontWeight:900,color:s.c,textShadow:`0 0 20px ${s.c}40`}}>{s.n}</div><div style={{fontSize:9,color:"rgba(255,255,255,.35)",letterSpacing:"1.5px",textTransform:"uppercase",fontFamily:"'Space Mono',monospace",fontWeight:700}}>{s.l}</div></div>)}
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:5,marginTop:24,fontSize:11,flexWrap:"wrap",color:"rgba(255,255,255,.35)"}}>
        {["SFO","SF","Yosemite","Death Valley","Zion","Grand Canyon","Vegas","SIN"].map((s,i,a)=><span key={i} style={{display:"flex",alignItems:"center",gap:5}}><span style={{color:i===0||i===a.length-1?"#FF2D87":"rgba(255,255,255,.35)",fontWeight:i===0||i===a.length-1?700:500}}>{s}</span>{i<a.length-1&&<span style={{color:"rgba(255,255,255,.15)",fontSize:10}}>→</span>}</span>)}
      </div>
    </div>
    <div style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,.2)",marginBottom:24,fontFamily:"'Space Mono',monospace",animation:"pu 3s ease-in-out infinite"}}>↓ tap stops · tap keywords ↓</div>
    <div style={{padding:"0 16px 60px",display:"flex",flexDirection:"column",alignItems:"center",position:"relative",zIndex:1}}>
      {S.map((stop,i)=><Card key={stop.id} stop={stop} index={i} isOpen={openId===stop.id} onToggle={()=>setOpenId(openId===stop.id?null:stop.id)}/>)}
    </div>
    <div style={{textAlign:"center",padding:"24px 24px 48px",borderTop:"1px solid rgba(255,255,255,.05)",margin:"0 24px",position:"relative",zIndex:1}}>
      <div style={{fontSize:28,marginBottom:10,animation:"fl 3s ease-in-out infinite"}}>🚐💨</div>
      <div style={{fontSize:16,fontWeight:700,background:"linear-gradient(90deg,#FF2D87,#FFD600)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>See you on the road, family.</div>
      <div style={{fontSize:10,color:"rgba(255,255,255,.15)",marginTop:8,fontFamily:"'Space Mono',monospace"}}>Built from USA_2026.numbers</div>
    </div>
  </div>);
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
